
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <title>TRYONIX Image Review</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 30px;
                font-family: Arial, sans-serif;
                background: #101010;
                color: white;
            }

            h1 {
                text-align: center;
                margin-bottom: 10px;
            }

            .subtitle {
                text-align: center;
                color: #aaa;
                margin-bottom: 35px;
            }

            .grid {
                display: grid;
                grid-template-columns:
                    repeat(auto-fit, minmax(240px, 1fr));
                gap: 20px;
            }

            article {
                background: #1e1e1e;
                padding: 15px;
                border-radius: 12px;
                border: 1px solid #333;
            }

            img {
                width: 100%;
                height: 270px;
                object-fit: contain;
                background: white;
                border-radius: 8px;
            }

            h3 {
                font-size: 16px;
                margin-top: 15px;
            }

            p {
                color: #bbb;
                font-size: 13px;
            }

            a {
                display: inline-block;
                color: #9ac5ff;
                margin-right: 12px;
                margin-top: 8px;
                font-size: 13px;
            }
        </style>
    </head>

    <body>
        <h1>TRYONIX Product Image Review</h1>

        <p class="subtitle">
            Review clothing type, color, fit and license
            before approving images.
        </p>

        <div class="grid">
    </div></body></html>
